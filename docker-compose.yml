services:
  harmony:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5000:5000"
      - "5001:5001"
      - "5002:5002"
    volumes:
      - ./feedback.csv:/app/feedback.csv
      - ./static/uploads:/app/static/uploads
    restart: unless-stopped
